<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess The Rank Submission</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f1923;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.card{
    background:#1b2733;
    padding:30px;
    border-radius:20px;
    width:500px;
    max-width:95%;
}

h1{
    text-align:center;
}

input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    background:#ff4655;
    color:white;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

#status{
    margin-top:15px;
    text-align:center;
}
</style>
</head>
<body>

<div class="card">

<h1>🎯 Guess The Rank</h1>

<p>Lade deinen Valorant Clip hoch.</p>

<input id="riotName" placeholder="Riot Name">

<select id="rank">
<option>Iron</option>
<option>Bronze</option>
<option>Silver</option>
<option>Gold</option>
<option>Platin</option>
<option>Diamant</option>
<option>Ascendant</option>
<option>Immortal</option>
<option>Radiant</option>
</select>

<input id="clip" type="file" accept="video/*">

<button onclick="uploadClip()">
📤 Clip hochladen
</button>

<div id="status"></div>

</div>

<script src="upload.js"></script>

</body>
</html>
